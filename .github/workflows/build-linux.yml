name: Build Linux + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - name: Restore
        run: dotnet restore FlipsiForge.slnx

      - name: Build (All Projects)
        run: dotnet build FlipsiForge.slnx -c Release --no-restore

      - name: Publish Server Full (linux-x64, self-contained)
        run: |
          dotnet publish src/FlipsiForge.Server/FlipsiForge.Server.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -o dist/linux-server-full

      - name: Publish Server Lite (linux-x64, self-contained)
        run: |
          # Lite = gleiche Binary, andere appsettings.json
          cp -r dist/linux-server-full dist/linux-server-lite
          cat > dist/linux-server-lite/appsettings.json << 'EOF'
          {
            "Version": "0.6.0",
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "Server": {
              "Mode": "Lite",
              "AI": false,
              "WebUI": false
            },
            "AI": {
              "ModelChoice": "Auto",
              "ModelPath": "",
              "Streaming": false
            },
            "Bot": {
              "Enabled": false,
              "Frequency": "Normal"
            },
            "Backup": {
              "AutoInterval": "off",
              "Path": ""
            }
          }
          EOF

      - name: Publish Desktop (linux-x64, self-contained)
        run: |
          dotnet publish src/FlipsiForge.Desktop/FlipsiForge.Desktop.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -o dist/linux-desktop

      - name: Build MockMoonraker
        run: |
          dotnet publish src/FlipsiForge.MockMoonraker/FlipsiForge.MockMoonraker.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -o dist/linux-mockmoonraker

      - name: Create Server Full tar.gz
        run: tar -czf dist/FlipsiForge-Server-Full-linux-x64.tar.gz -C dist/linux-server-full .

      - name: Create Server Lite tar.gz
        run: tar -czf dist/FlipsiForge-Server-Lite-linux-x64.tar.gz -C dist/linux-server-lite .

      - name: Create Desktop tar.gz
        run: tar -czf dist/FlipsiForge-Desktop-linux-x64.tar.gz -C dist/linux-desktop .

      - name: Create MockMoonraker tar.gz
        run: tar -czf dist/FlipsiForge-MockMoonraker-linux-x64.tar.gz -C dist/linux-mockmoonraker .

      - name: Upload Server Full Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipsiForge-Server-Full-linux-x64
          path: dist/FlipsiForge-Server-Full-linux-x64.tar.gz

      - name: Upload Server Lite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipsiForge-Server-Lite-linux-x64
          path: dist/FlipsiForge-Server-Lite-linux-x64.tar.gz

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipsiForge-Desktop-linux-x64
          path: dist/FlipsiForge-Desktop-linux-x64.tar.gz

      - name: Upload MockMoonraker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipsiForge-MockMoonraker-linux-x64
          path: dist/FlipsiForge-MockMoonraker-linux-x64.tar.gz

      - name: Upload to GitHub Release (on release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/FlipsiForge-Server-Full-linux-x64.tar.gz
            dist/FlipsiForge-Server-Lite-linux-x64.tar.gz
            dist/FlipsiForge-Desktop-linux-x64.tar.gz
            dist/FlipsiForge-MockMoonraker-linux-x64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}